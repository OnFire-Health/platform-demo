openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Platform Demo API — a multi-tenant Platform that hosts many independent
    practitioners, each of whom connects their own Onfire Health partner account
    via OAuth. The Platform lists each practitioner's rate cards, creates
    invoices on their behalf, and receives invoice webhooks at one routed
    receiver.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Platform operator session
  - name: connections
    description: Connected practitioners (one Onfire connection each)
  - name: invoices
    description: Invoices created on behalf of practitioners
  - name: webhooks
    description: Received Onfire webhook events
  - name: platform
    description: Platform configuration and summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Current operator session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
    post:
      operationId: login
      tags: [session]
      summary: Operator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: logout
      tags: [session]
      summary: Operator logout
      responses:
        "204":
          description: Logged out

  /platform/config:
    get:
      operationId: getPlatformConfig
      tags: [platform]
      summary: Platform Onfire configuration status
      description: Reports whether Onfire env vars are configured and the callback/webhook URLs for Onfire ops to register.
      responses:
        "200":
          description: Config status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfig"

  /platform/summary:
    get:
      operationId: getPlatformSummary
      tags: [platform]
      summary: Dashboard summary counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSummary"

  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List connected practitioners
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /connections/authorize:
    post:
      operationId: createAuthorizeUrl
      tags: [connections]
      summary: Begin connecting a practitioner
      description: Generates and persists a CSRF state, then returns the Onfire authorize URL to redirect the practitioner to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeInput"
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrl"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}:
    get:
      operationId: getConnection
      tags: [connections]
      summary: Get a single connection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/disconnect:
    post:
      operationId: disconnectConnection
      tags: [connections]
      summary: Disconnect a practitioner
      description: Revokes the Onfire token and marks the connection revoked.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Revoked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/rate-cards:
    get:
      operationId: listRateCards
      tags: [connections]
      summary: List a practitioner's Onfire rate cards
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Rate cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RateCard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream Onfire error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List local invoice mirror for a practitioner
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice on behalf of a practitioner
      description: Generates an external_invoice_ref idempotency key, posts to Onfire, and mirrors the result locally.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream Onfire error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/invoices/reconcile:
    post:
      operationId: reconcileInvoices
      tags: [invoices]
      summary: Reconcile the local invoice mirror against Onfire
      description: >-
        Pulls the practitioner's invoices from Onfire (the source of truth) and upserts
        each into the local mirror, keyed on external_invoice_ref. Use to re-converge the
        mirror when a webhook delivery was missed.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Reconcile result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream Onfire error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/checkout-sessions:
    get:
      operationId: listCheckoutSessions
      tags: [checkout-sessions]
      summary: List the local Checkout Session mirror for a practitioner
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Checkout Sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Connection is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCheckoutSession
      tags: [checkout-sessions]
      summary: Create a hosted Onfire Checkout Session
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionInput"
      responses:
        "200":
          description: Onfire outcome, including replay and conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResult"
        "400":
          description: Invalid input or revoked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Request failed before an Onfire outcome could be returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/checkout-sessions/{checkoutSessionId}/replay:
    post:
      operationId: replayCheckoutSession
      tags: [checkout-sessions]
      summary: Demonstrate Onfire Checkout Session idempotency
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - name: checkoutSessionId
          in: path
          required: true
          description: Local Checkout Session row id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionReplayInput"
      responses:
        "200":
          description: Onfire outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResult"
        "400":
          description: Invalid input or revoked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Connection or Checkout Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /connections/{id}/checkout-sessions/retrieve:
    post:
      operationId: retrieveCheckoutSession
      tags: [checkout-sessions]
      summary: Retrieve a Checkout Session from Onfire and refresh the local mirror
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionRetrieveInput"
      responses:
        "200":
          description: Refreshed Checkout Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid input or revoked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Onfire scope or consent error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Connection or Checkout Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhook-events:
    get:
      operationId: listWebhookEvents
      tags: [webhooks]
      summary: Recent received webhook events
      description: Most recent Onfire webhook events received at the single platform receiver, with the practitioner each was routed to.
      responses:
        "200":
          description: Webhook events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEvent"

components:
  parameters:
    ConnectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Local connection id (uuid)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SessionState:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        operator:
          type: ["string", "null"]

    OperatorCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1

    PlatformConfig:
      type: object
      required: [configured, redirectUri, webhookUrl, scopes, missing]
      properties:
        configured:
          type: boolean
        redirectUri:
          type: string
        webhookUrl:
          type: string
        scopes:
          type: string
        authorizeUrl:
          type: ["string", "null"]
        missing:
          type: array
          items:
            type: string

    PlatformSummary:
      type: object
      required:
        - totalConnections
        - activeConnections
        - totalInvoices
        - paidInvoices
        - openInvoices
        - webhookEvents
      properties:
        totalConnections:
          type: integer
        activeConnections:
          type: integer
        totalInvoices:
          type: integer
        paidInvoices:
          type: integer
        openInvoices:
          type: integer
        webhookEvents:
          type: integer

    Connection:
      type: object
      required:
        - id
        - partnerPublicId
        - displayName
        - status
        - connectedAt
      properties:
        id:
          type: string
        partnerPublicId:
          type: string
        displayName:
          type: string
        orgId:
          type: ["string", "null"]
        scope:
          type: ["string", "null"]
        status:
          type: string
          description: active | revoked
        connectedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    AuthorizeInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1

    AuthorizeUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string

    RateCard:
      type: object
      # Mirrors onfire-core PartnerRateCardResponse. Prices are in DOLLARS (not cents).
      # Onfire does not return a currency on rate cards — it defaults to USD at invoice
      # creation.
      required: [refId, productName, company, type, active]
      properties:
        refId:
          type: string
        productName:
          type: string
        company:
          type: string
        type:
          type: string
          description: "bundle | addOn"
        duration:
          type: ["string", "null"]
        fullPrice:
          type: ["string", "null"]
          description: "Headline price in dollars."
        installmentsPrice:
          type: ["string", "null"]
        fullPriceOnly:
          type: boolean
        payoutPlan:
          type: ["string", "null"]
        subTitle:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        active:
          type: boolean

    Invoice:
      type: object
      required:
        - id
        - connectionId
        - externalInvoiceRef
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        connectionId:
          type: string
        externalInvoiceRef:
          type: string
        invoicePublicId:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        clientEmail:
          type: ["string", "null"]
        rateCardRefId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReconcileResult:
      type: object
      required:
        - reconciled
        - invoices
      properties:
        reconciled:
          type: integer
          description: Number of invoices upserted from Onfire into the local mirror.
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    InvoiceInput:
      type: object
      # Onfire requires name, phone and a structured billing address on every invoice
      # (PartnerInvoiceCreate is extra=forbid). Mirror that contract here.
      required:
        [rateCardRefId, clientEmail, clientName, clientPhone, clientBillingAddress]
      properties:
        externalInvoiceRef:
          type: string
          minLength: 1
          description: >-
            Platform's own stable reference for this invoice, used as the Onfire
            idempotency key. Re-POSTing the same value returns the existing
            invoice instead of creating a duplicate. Generated server-side if
            omitted.
        rateCardRefId:
          type: string
          minLength: 1
        clientEmail:
          type: string
          minLength: 1
        clientName:
          type: string
          minLength: 1
        clientPhone:
          type: string
          minLength: 1
        clientBillingAddress:
          $ref: "#/components/schemas/BillingAddress"
        externalClientRef:
          type: string

    BillingAddress:
      type: object
      required: [line1, city, state, postalCode]
      properties:
        line1:
          type: string
          minLength: 1
        line2:
          type: string
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        postalCode:
          type: string
          minLength: 1
        country:
          type: string

    CheckoutSession:
      type: object
      required: [id, connectionId, clientReferenceId, onfireId, publicId, payerUrl, rateCardRefId, quantity, status, paymentStatus, amount, currency, successUrl, cancelUrl, metadata, expiresAt, completedAt, lastEventType, lastCreateHttpStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
        connectionId:
          type: string
        clientReferenceId:
          type: string
        onfireId:
          type: ["string", "null"]
        publicId:
          type: ["string", "null"]
        payerUrl:
          type: ["string", "null"]
        rateCardRefId:
          type: string
        quantity:
          type: integer
        status:
          type: string
          description: open | complete | expired | cancelled
        paymentStatus:
          type: string
          description: unpaid | processing | paid
        amount:
          type: ["string", "null"]
          description: Decimal string; never a floating-point amount
        currency:
          type: ["string", "null"]
        successUrl:
          type: string
        cancelUrl:
          type: string
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        expiresAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        lastEventType:
          type: ["string", "null"]
        lastCreateHttpStatus:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Entity-shaped component names avoid colliding with Orval's generated
    # CreateCheckoutSessionBody / ReplayCheckoutSessionBody / RetrieveCheckoutSessionBody Zod exports.
    CheckoutSessionInput:
      type: object
      required: [rateCardRefId]
      properties:
        rateCardRefId:
          type: string
        quantity:
          type: integer
        clientReferenceId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    CheckoutSessionReplayInput:
      type: object
      properties:
        change:
          type: string
          enum: [quantityPlusOne]

    CheckoutSessionRetrieveInput:
      type: object
      required: [checkoutSessionId]
      properties:
        checkoutSessionId:
          type: string

    CheckoutSessionResult:
      type: object
      required: [httpStatus]
      properties:
        httpStatus:
          type: integer
        checkoutSession:
          $ref: "#/components/schemas/CheckoutSession"
        error:
          type: string

    WebhookEvent:
      type: object
      required:
        - id
        - envelopeId
        - routed
        - receivedAt
      properties:
        id:
          type: string
        envelopeId:
          type: string
        type:
          type: ["string", "null"]
        partnerPublicId:
          type: ["string", "null"]
        externalInvoiceRef:
          type: ["string", "null"]
        invoicePublicId:
          type: ["string", "null"]
        checkoutSessionPublicId:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        connectionId:
          type: ["string", "null"]
        connectionDisplayName:
          type: ["string", "null"]
        routed:
          type: boolean
        receivedAt:
          type: string
          format: date-time
